# =====================================================================
#  HPO Visio — serveur web (front Angular + relais vers l'API et LiveKit)
# =====================================================================
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Import CSV de l'annuaire depuis l'écran Admin
  client_max_body_size 6m;
  server_tokens off;

  # --- API Express ----------------------------------------------------
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Enregistrements vidéo : transmis au fil de l'eau (lecture et téléchargement)
    proxy_max_temp_file_size 0;
    proxy_read_timeout 300s;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # --- Signalisation LiveKit (WebSocket), même origine que le site ----
  # Le son et l'image passent ensuite en direct (UDP 7882 / TCP 7881).
  location /rtc {
    proxy_pass http://livekit:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # --- Fichiers compilés (noms avec empreinte : cache long) ----------
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # --- Application Angular (routes gérées côté navigateur) -----------
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security-headers.inc;
  }
}
